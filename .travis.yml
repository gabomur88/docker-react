sudo: required
services:
  - docker

before_install:
  - docker build -t gabomur/docker-react -f Dockerfile.dev .

script:
  - docker run -e CI=true gabomur/docker-react npm run test

deploy:
  provider: elasticbeanstalk
  region: "us-east-2"
  app: "docker-react"
  env: "docker-react-env"
  bucket_name: "elasticbeanstalk-us-east-2-714665050152"
  bucket_path: "docker-react"
  on:
    branch: master
  access_key_id: $AWS_ACCESSS_KEY
  secret_access_key:"$AWS_SECRET_KEY"